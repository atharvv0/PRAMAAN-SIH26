version: "3.9"

# PRAMAAN — Level 1 (SIH MVP) infra
# One workstation / server target.
# backend + frontend boot today (see services/backend and services/frontend).
# model-control/knowledge/governance/sandbox are in-process Python packages
# imported by backend for the MVP (see docs/architecture.md "Deployment Topology")
# and get their own containers post-SIH if warranted.

services:
  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      - postgres
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_HOST: postgres
      QDRANT_HOST: qdrant
      MODEL_RUNTIME_HOST: host.docker.internal
    networks:
      - pramaan-net

  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: http
        VITE_API_BASE_URL: /api/v1
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - pramaan-net

  postgres:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pramaan}
      POSTGRES_USER: ${POSTGRES_USER:-pramaan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5433"
    volumes:
      - pramaan-pgdata:/var/lib/postgresql/data
    networks:
      - pramaan-net

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - pramaan-qdrant-data:/qdrant/storage
    networks:
      - pramaan-net

  # model-runtime, sandbox, and governance/network-monitor services remain
  # in-process or are added separately as those modules mature.

networks:
  pramaan-net:
    driver: bridge
    # NOTE: sovereignty boundary is enforced at the network-policy layer
    # (see infra/network-policy/), not by this compose file alone.

volumes:
  pramaan-pgdata:
  pramaan-qdrant-data:
